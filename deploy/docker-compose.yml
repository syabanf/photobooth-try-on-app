# The booth server on a Linux booth computer.
#
#   cd deploy
#   PHOTO_PUBLIC_ORIGIN=http://<booth-IP>:4173 docker compose up -d --build
#
# With HTTPS for tablets and kiosks (deploy/nginx.conf, certificates in deploy/certs):
#
#   PHOTO_PUBLIC_ORIGIN=http://<booth-IP> BOOTH_HOST=127.0.0.1 docker compose --profile https up -d --build
#
# Both services use the host network on purpose. The booth-only routes answer only 127.0.0.1, and
# Docker's port publishing would make every request, the guests' phones included, arrive from the
# same gateway address. Host networking works on Linux only.

services:
  booth:
    build: ..
    image: dusun-bambu-booth
    network_mode: host
    restart: unless-stopped
    environment:
      PORT: ${BOOTH_PORT:-4173}
      # 127.0.0.1 when nginx sits in front, so nothing reaches Node without it.
      HOST: ${BOOTH_HOST:-0.0.0.0}
      # The address customers' phones open for their photos and the QRIS forwarding phone posts to.
      PHOTO_PUBLIC_ORIGIN: ${PHOTO_PUBLIC_ORIGIN:?Set PHOTO_PUBLIC_ORIGIN to http://<booth-IP>:4173, or http://<booth-IP> behind nginx}
    volumes:
      # Customer photos and the QRIS state. Back this volume up.
      - booth-data:/data

  https:
    image: nginx:1.27-bookworm
    profiles: [https]
    network_mode: host
    restart: unless-stopped
    depends_on: [booth]
    volumes:
      # Replaces nginx's own default site, which would otherwise answer requests by IP address.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  booth-data:
