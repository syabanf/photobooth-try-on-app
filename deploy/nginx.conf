# The booth behind nginx: nginx adds HTTPS, `pnpm serve` does everything else.
#
# Tablets and kiosks on the venue network open https://<booth-IP>, since browsers give the camera
# only to HTTPS pages. Customer phones and the phone that forwards payment notifications use
# http://<booth-IP>, which needs no certificate.
#
# Start Node where only nginx can reach it:
#   HOST=127.0.0.1 PHOTO_PUBLIC_ORIGIN=http://<booth-IP> pnpm serve
#
# Include this file from the http block of the main nginx.conf, or copy it to conf.d/booth.conf.

server {
  listen 80;
  listen 443 ssl;
  server_name _;

  ssl_certificate     /etc/nginx/certs/booth.crt;
  ssl_certificate_key /etc/nginx/certs/booth.key;

  # A session video can reach 100 MB; `pnpm serve` enforces the same limit.
  client_max_body_size 100m;

  location / {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Node reads this to tell the booth computer from other devices. It replaces whatever a caller
    # sent, so keep the line: without it every device on the network counts as the booth computer.
    proxy_set_header X-Real-IP $remote_addr;
    # Node compresses and sets the cache headers itself; pass uploads and photos straight through.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }
}
